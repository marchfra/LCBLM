# SAE-concept — SST-2 / Mistral-7B
# L1 SAE whose latent_dim matches the VAEE's num_embeddings.
# Copy to sae_concept_sst2.toml and set embeddings_path before running.
#
# Usage:
#   interp-train run --model sae_concept experiments/interpretability/configs/sae_concept_sst2.toml

# ── Dataset ───────────────────────────────────────────────────────────────────
embeddings_path = "/path/to/sst2_mistral_embeddings"
eos_token_id = 2
n_samples = -1

# ── Training ──────────────────────────────────────────────────────────────────
epochs = 200
lr = 1e-4
batch_size = 512
seed = 42

early_stopping_patience = 30
early_stopping_min_delta = 0.0

# ── SAE architecture ──────────────────────────────────────────────────────────
vaee_num_embeddings = 256 # latent_dim = this value; keep in sync with vaee_sst2.toml
lambda_l1 = 1e-3
normalize_decoder = true

# ── Weights & Biases ──────────────────────────────────────────────────────────
# wandb_project = "lcblm-interpretability"
