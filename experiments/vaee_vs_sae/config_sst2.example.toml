dataset = "sst2_mistral"
embeddings_path = "sst2_mistral_embeddings"
n_samples = -1

num_embeddings_list = [16, 32, 64, 128, 256]
epochs = 100
lr = 1e-4
batch_size = 512
seed = 42

vaee_hidden_dim = 256
vaee_encoder_type = "mlp"   # "mlp" | "linear" | "shallow"
vaee_embedding_size = 16
vaee_gumbel_temp = 0.5
vaee_pi = 0.1
vaee_gamma = 0.01
vaee_beta = 1.0
vaee_beta_warmup_epochs = 0 # set e.g. to 500 to ramp beta from 0 → vaee_beta over 500 epochs
vaee_lambda_ent = 0.01

sae_lambda_l1 = 1e-3
sae_normalize_decoder = true
# skip_vaee = true                  # skip VAEE training
# skip_sae_concept_matched = true   # skip concept-matched SAE
# skip_sae_param_matched = true     # skip parameter-matched SAE

# wandb_project = "vaee-vs-sae"       # production runs
# wandb_project = "vaee-vs-sae-dev"   # exploratory / debug runs
