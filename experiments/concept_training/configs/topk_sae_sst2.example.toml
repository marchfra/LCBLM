# TopK SAE — SST-2 / Mistral-7B
# Copy to topk_sae_sst2.toml and set embeddings_path before running.
#
# Usage:
#   ct-train topk_sae experiments/concept_training/configs/topk_sae_sst2.toml

# ── Dataset ───────────────────────────────────────────────────────────────────
embeddings_path = "/path/to/sst2_mistral_embeddings"
eos_token_id = 2
n_samples = -1

# ── Training ──────────────────────────────────────────────────────────────────
epochs = 3000
lr = 1e-4
batch_size = 2048
seed = 42

early_stopping_patience = 500
early_stopping_min_delta = 0.0

# ── TopK SAE architecture ─────────────────────────────────────────────────────
k = 64                   # active features per token
latent_dim = 0           # 0 → 4 × input_dim (standard expansion ratio)

# ── Weights & Biases ──────────────────────────────────────────────────────────
# wandb_project = "lcblm"
