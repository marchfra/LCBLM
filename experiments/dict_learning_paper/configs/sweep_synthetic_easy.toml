# Dict-learning sanity check — synthetic (easy) dataset
# 2D, 8 atoms on unit circle, k=1 active per sample, binary coefficients {0,+1}.
# Distinct cluster modes: 8 (= n_features × {+1}).
# Hyperparameters exactly match ground truth (no overcompleteness).
#
# Usage:
#   dl-sweep --config experiments/dict_learning_paper/configs/sweep_synthetic_easy.toml

wandb_project = "dict-learning-paper"

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset = "synthetic"
output_dir = "experiments/dict_learning_paper/outputs"

# ── Shared training settings ──────────────────────────────────────────────────
# (must come before any [section] — TOML scopes subsequent keys into the section)
epochs = 1000
lr = 1e-4
batch_size = 256
early_stopping_patience = 200

[synthetic]
n_samples = 1000
n_features = 8
n_active = 1
input_dim = 2
noise_std = 0.05
binary_coefs = true

# ── VAEE ──────────────────────────────────────────────────────────────────────
# num_embeddings = n_features = 8; pi = n_active / num_embeddings = 1/8.
# beta is the sparsity-KL weight. Bumped to 32 to push actual L0 closer to
# target_l0 = 1. target_l0 = 1 will trigger a "below 2" warning (expected).
[vaee]
num_embeddings = 8
embedding_size = 4
beta = 32.0
pi = [0.125]

# ── VAEE (shared encoder) ─────────────────────────────────────────────────────
# Same as vaee but without gamma — no per-concept encoder mean to regularize.
[vaee_shared_encoder]
num_embeddings = 8
embedding_size = 4
beta = 32.0
pi = [0.125]

# ── TopK-SAE ──────────────────────────────────────────────────────────────────
# k_aux <= latent_dim is required; setting k_aux = latent_dim is the safest choice
# for tiny latents (default 512 would crash).
[topk_sae]
latent_dim = 8
k_aux = 8
k = [1]

# ── L1-SAE ────────────────────────────────────────────────────────────────────
# Sweeping lambda=2.0 and 3.0; lambda=1.0 gave L0≈3.8, lambda=5.0 blew MSE.
# These two points bracket the useful range without entering the MSE-blowup zone.
[sae_concept]
vaee_num_embeddings = 8
lambda_l1 = [2.0, 3.0]

# ── VQ-VAE ────────────────────────────────────────────────────────────────────
# num_codes = number of distinct modes (8); each code memorises one mode.
[vq_vae]
embedding_dim = 4
num_codes = [8]

# ── β-VAE ─────────────────────────────────────────────────────────────────────
# Pre-collapse grid: β=0.5 and above collapse on this dataset; usable range is
# β ∈ [0.05, 0.4]. Five points bracket the front from high-L0/low-MSE (0.05)
# to the collapse boundary (0.4).
[beta_vae]
latent_dim = 8
kl_warmup_epochs = 10
beta = [0.05, 0.1, 0.2, 0.3, 0.4]
