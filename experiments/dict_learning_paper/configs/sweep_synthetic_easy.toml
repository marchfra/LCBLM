# Dict-learning sanity check — synthetic (easy) dataset
# 2D, 8 atoms on unit circle, k=1 active per sample, binary coefficients {0,+1}.
# Distinct cluster modes: 8 (= n_features × {+1}).
# Hyperparameters exactly match ground truth (no overcompleteness).
#
# Usage:
#   dl-sweep --config experiments/dict_learning_paper/configs/sweep_synthetic_easy.toml

wandb_project = "dict-learning-paper"

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset = "synthetic"
output_dir = "experiments/dict_learning_paper/outputs"

# ── Shared training settings ──────────────────────────────────────────────────
# (must come before any [section] — TOML scopes subsequent keys into the section)
epochs = 1000
lr = 1e-4
batch_size = 256
early_stopping_patience = 200

[synthetic]
n_samples = 1000
n_features = 8
n_active = 1
input_dim = 2
noise_std = 0.05
binary_coefs = true

# ── VAEE ──────────────────────────────────────────────────────────────────────
# num_embeddings = n_features = 8; pi = n_active / num_embeddings = 1/8.
# target_l0 = 1 will trigger a "below 2" warning (expected, caught & ignored).
[vaee]
num_embeddings = 8
embedding_size = 4
pi = [0.125]

# ── TopK-SAE ──────────────────────────────────────────────────────────────────
# k_aux <= latent_dim is required; setting k_aux = latent_dim is the safest choice
# for tiny latents (default 512 would crash).
[topk_sae]
latent_dim = 8
k_aux = 8
k = [1]

# ── L1-SAE ────────────────────────────────────────────────────────────────────
[sae_concept]
vaee_num_embeddings = 8
lambda_l1 = [0.1]

# ── VQ-VAE ────────────────────────────────────────────────────────────────────
# num_codes = number of distinct modes (8); each code memorises one mode.
[vq_vae]
embedding_dim = 4
num_codes = [8]

# ── β-VAE ─────────────────────────────────────────────────────────────────────
[beta_vae]
latent_dim = 8
kl_warmup_epochs = 50
beta = [1e-3]
