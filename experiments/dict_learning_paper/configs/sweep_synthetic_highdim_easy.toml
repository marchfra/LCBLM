# High-dim EASY tier — overcomplete dictionary recovery, k=1 singletons.
# D=32 input dims, K=64 atoms (2x overcomplete → genuine superposition geometry),
# one active atom per sample, small additive noise (within-sample realism).
# Baseline tier: every model should recover the 64 atoms from single-atom examples.
#
# NOTE: dictionary size = K = 64 for all models (matched). VAEE concept capacity
# is embedding_size per concept; SAE/VQ latent capacity is 1 per unit — the
# Pareto x-axis is # active concepts, not capacity (see report).

wandb_project = "dict-learning-paper"
dataset = "synthetic"
output_dir = "experiments/dict_learning_paper/outputs"
recovery_threshold = 0.7   # dimension-aware: 0.9 too strict in 32-D (random pairs ~0.18)

epochs = 1000
lr = 1e-4
batch_size = 1024          # ≥16× the 64 concepts → stable batch-level gate stats
early_stopping_patience = 300

[synthetic]
n_samples = 20000
n_features = 64
n_active = 1
input_dim = 32
noise_std = 0.05
binary_coefs = true

# beta swept low to find where gates fire without collapsing (per-fire KL cost
# ≈ beta·log(1/pi) ≈ 4·beta nats; beta=1 crushed the gates → L0=0.12).
[vaee]
num_embeddings = 64
beta = [0.05, 0.1, 0.3]
pi = 0.016          # 1/64
lambda_ortho = 2.0
lambda_ent = 0.0
lambda_ent_warmup_epochs = 0
gumbel_temp = 0.5
sim_metric = "inner_product"
embedding_size = 4

[vaee_shared_encoder]
num_embeddings = 64
beta = [0.05, 0.1, 0.3]
pi = 0.016
lambda_ortho = 2.0
lambda_ent = 0.0
lambda_ent_warmup_epochs = 0
gumbel_temp = 0.5
sim_metric = "inner_product"
embedding_size = 4

[topk_sae]
latent_dim = 64
k_aux = 64
k = [1]

[sae_concept]
latent_dim = 64
lambda_l1 = [0.1]

[vq_vae]
embedding_dim = 8
num_codes = [64]

[beta_vae]
latent_dim = 64
kl_warmup_epochs = 50
beta = [0.01]
