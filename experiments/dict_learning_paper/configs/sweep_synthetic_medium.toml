# Dict-learning sanity check — synthetic (medium) dataset
# 2D, 5 atoms on unit circle (analytically spaced), k=2 active per sample,
# binary coefficients {0,+1}.
# Distinct sample modes: C(5,2) = 10 (sums of unordered atom pairs).
# Hyperparameters exactly match ground truth (no overcompleteness).
#
# Usage:
#   dl-sweep --config experiments/dict_learning_paper/configs/sweep_synthetic_medium.toml

wandb_project = "dict-learning-paper"

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset = "synthetic"
output_dir = "experiments/dict_learning_paper/outputs"

# ── Shared training settings ──────────────────────────────────────────────────
# (must come before any [section] — TOML scopes subsequent keys into the section)
epochs = 1000
lr = 1e-4
batch_size = 256
early_stopping_patience = 200

[synthetic]
n_samples = 1000
n_features = 5
n_active = 2
input_dim = 2
noise_std = 0.05
binary_coefs = true
min_separation = 0.628318  # π/5 radians for uniform 5-atom spacing

# ── VAEE ──────────────────────────────────────────────────────────────────────
# num_embeddings = n_features = 5; pi = n_active / num_embeddings = 2/5.
# target_l0 = 2 sits exactly at the lower-bound warning threshold.
[vaee]
num_embeddings = 5
embedding_size = 4
pi = [0.4]

# ── VAEE (shared encoder) ─────────────────────────────────────────────────────
# Same as vaee but without gamma — no per-concept encoder mean to regularize.
[vaee_shared_encoder]
num_embeddings  = 5
embedding_size  = 4
sparsity_param  = "pi"
sparsity_values = [0.4]

# ── TopK-SAE ──────────────────────────────────────────────────────────────────
# k_aux <= latent_dim is required; setting k_aux = latent_dim is the safest choice
# for tiny latents (default 512 would crash).
[topk_sae]
latent_dim = 5
k_aux = 5
k = [2]

# ── L1-SAE ────────────────────────────────────────────────────────────────────
[sae_concept]
vaee_num_embeddings = 5
lambda_l1 = [0.1]

# ── VQ-VAE ────────────────────────────────────────────────────────────────────
# num_codes = number of distinct modes (10); each code memorises one mode.
[vq_vae]
embedding_dim = 4
num_codes = [10]

# ── β-VAE ─────────────────────────────────────────────────────────────────────
# beta = 0.1 lowered from 1.0: prior value left reconstruction loss ~0.5.
[beta_vae]
latent_dim = 5
kl_warmup_epochs = 50
beta = [1e-3]
