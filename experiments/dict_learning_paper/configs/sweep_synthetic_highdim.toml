# Dict-learning Pareto sweep — synthetic (hard) dataset
# Full 256-dim sparse-superposition benchmark with ±1 coefficients.
#
# Usage:
#   dl-sweep --config experiments/dict_learning_paper/configs/sweep_synthetic_hard.toml

wandb_project = "dict-learning-paper"

# ── Dataset ───────────────────────────────────────────────────────────────────
dataset = "synthetic"
output_dir = "experiments/dict_learning_paper/outputs"
# data_path is not needed for synthetic

# ── Shared training settings ──────────────────────────────────────────────────
epochs = 1000
lr = 1e-4
batch_size = 512
early_stopping_patience = 200

# ── VAEE ──────────────────────────────────────────────────────────────────────
# pi = target_l0 / num_embeddings → [4/64, 8/64, 16/64] matches TopK k=[4,8,16]
[vaee]
num_embeddings = 64
embedding_size = 16
pi = [0.0625, 0.125, 0.25]

# ── TopK-SAE ──────────────────────────────────────────────────────────────────
[topk_sae]
k = [4, 8, 16]

# ── L1-SAE ────────────────────────────────────────────────────────────────────
[sae_concept]
latent_dim = 64
lambda_l1 = [1.0, 5.0, 10.0]

# ── VQ-VAE ────────────────────────────────────────────────────────────────────
# Higher patience because dead-code resets cause val loss to fluctuate early on.
[vq_vae]
num_codes = [64, 128, 256]

# ── β-VAE ─────────────────────────────────────────────────────────────────────
# KL warmup prevents posterior collapse; lower β range keeps reconstruction usable.
[beta_vae]
latent_dim = 64
kl_warmup_epochs = 10
beta = [1e-4, 1e-3, 1e-2]
